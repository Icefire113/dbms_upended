[package]
name = "dbms_upended"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.19"
clap = { version = "4.6.5", features = ["env", "cargo", "derive"] }
tokio = { version = "1.53.1", features = ["full"] }
bitcode = { version = "0.6.9" }
xxhash-rust = { version = "0.8.18", features = ["xxh3", "const_xxh3"] }
dialoguer = { version = "0.12.0", features = ["history", "completion"] }
clap_complete = "4.6.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "fmt",
    "std",
] }
rkyv = { version = "0.8.17", features = ["alloc", "std", "bytecheck"] }
ordered-float = { version = "5.3.0", features = ["rkyv"] }
memmap2 = "0.9.11"

[profile.release]
opt-level = 3
debug = true
lto = "fat"
codegen-units = 1
